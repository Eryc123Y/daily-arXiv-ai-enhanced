# Daily crawl of arXiv /new listings, published to the `data` branch.
#
# Summaries depend on the SUMMARY_MODE repository variable:
#   claude-code (default)  this job only crawls and publishes; a local Claude
#                          Code task writes the Chinese summaries afterwards.
#   api                    this job also summarises with Claude Haiku 5.5;
#                          needs the ANTHROPIC_API_KEY secret.
# The site shows papers as "summary pending" until their summary exists.

name: arXiv-daily-ai-enhanced

on:
  schedule:
    # arXiv announces at 20:00 US Eastern (00:00 UTC in summer, 01:00 UTC in
    # winter), Sunday to Thursday. Days without an announcement, and reruns,
    # publish nothing new. The second run picks up a batch that was late.
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CATEGORIES: ${{ vars.CATEGORIES || 'cs.CV, cs.AI, cs.LG, cs.CL, stat.ML' }}
      LANGUAGE: ${{ vars.LANGUAGE || 'Chinese' }}
      # Only the files we touch are downloaded from the large data branch.
      DATA_FETCH_ARGS: "--depth=1 --filter=blob:none"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Crawl arXiv listings
        id: crawl
        run: |
          today=$(date -u +%F)
          echo "date=$today" >> "$GITHUB_OUTPUT"
          cd daily_arxiv
          uv run scrapy crawl arxiv -o "$RUNNER_TEMP/crawl.jsonl" -L INFO
          if [ ! -s "$RUNNER_TEMP/crawl.jsonl" ]; then
            echo "::error::The crawl returned no papers; arXiv may be unreachable."
            exit 1
          fi
          echo "Crawled $(wc -l < "$RUNNER_TEMP/crawl.jsonl") listing rows for $CATEGORIES"

      - name: Publish new papers to the data branch
        id: ingest
        run: uv run python -m summaries ingest --date "${{ steps.crawl.outputs.date }}" --input "$RUNNER_TEMP/crawl.jsonl"

      - name: Choose summary mode
        id: mode
        env:
          SUMMARY_MODE: ${{ vars.SUMMARY_MODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m summaries mode

      - name: Summarise with the Anthropic API
        if: steps.mode.outputs.mode == 'api'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m summaries api --days 3

      - name: Summary
        if: always()
        run: |
          {
            echo "### arXiv daily: ${{ steps.crawl.outputs.date }}"
            echo "- new papers published: ${{ steps.ingest.outputs.added || 0 }} (day total ${{ steps.ingest.outputs.papers || 'unchanged' }})"
            echo "- summary mode: ${{ steps.mode.outputs.mode || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"
