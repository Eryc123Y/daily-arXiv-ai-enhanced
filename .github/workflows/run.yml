# Daily crawl of arXiv /new listings, published to the `data` branch.
#
# Summaries depend on the SUMMARY_MODE repository variable:
#   claude-code (default)  this job only crawls and publishes; a local Claude
#                          Code task writes the summaries afterwards.
#   api                    this job also summarises through SUMMARY_PROVIDER
#                          (anthropic, openai or gemini) and its key secret.
# The site shows papers as "summary pending" until their summary exists.

name: arXiv-daily-ai-enhanced

on:
  schedule:
    # arXiv announces at 20:00 US Eastern (00:00 UTC in summer, 01:00 UTC in
    # winter), Sunday to Thursday, so new listings appear Monday to Friday
    # UTC. Holidays and reruns publish nothing new. The second run picks up a
    # batch that was late.
    - cron: "30 1 * * 1-5"
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CATEGORIES: ${{ vars.CATEGORIES || 'cs.CV, cs.AI, cs.LG, cs.CL, stat.ML' }}
      LANGUAGE: ${{ vars.LANGUAGE || 'English' }}
      # Only the files we touch are downloaded from the large data branch.
      DATA_FETCH_ARGS: "--depth=1 --filter=blob:none"
      # Data commits are made as these (repository variables); unset, as the github-actions bot.
      COMMIT_NAME: ${{ vars.COMMIT_NAME }}
      COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Crawl arXiv listings
        id: crawl
        run: |
          today=$(date -u +%F)
          echo "date=$today" >> "$GITHUB_OUTPUT"
          cd daily_arxiv
          uv run scrapy crawl arxiv -o "$RUNNER_TEMP/crawl.jsonl" -L INFO
          if [ ! -s "$RUNNER_TEMP/crawl.jsonl" ]; then
            echo "::error::The crawl returned no papers; arXiv may be unreachable."
            exit 1
          fi
          echo "Crawled $(wc -l < "$RUNNER_TEMP/crawl.jsonl") listing rows for $CATEGORIES"

      - name: Publish new papers to the data branch
        id: ingest
        run: uv run python -m summaries ingest --date "${{ steps.crawl.outputs.date }}" --input "$RUNNER_TEMP/crawl.jsonl"

      - name: Choose summary mode
        id: mode
        env:
          SUMMARY_MODE: ${{ vars.SUMMARY_MODE }}
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          SUMMARY_REASONING_EFFORT: ${{ vars.SUMMARY_REASONING_EFFORT }}
          SUMMARY_RESPONSE_FORMAT: ${{ vars.SUMMARY_RESPONSE_FORMAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m summaries mode

      - name: Summarise through the API
        if: steps.mode.outputs.mode == 'api'
        env:
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          SUMMARY_REASONING_EFFORT: ${{ vars.SUMMARY_REASONING_EFFORT }}
          SUMMARY_RESPONSE_FORMAT: ${{ vars.SUMMARY_RESPONSE_FORMAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m summaries api --days 3

      - name: Log the summary path
        if: steps.mode.outputs.mode == 'api' && steps.ingest.outputs.has_new_content == 'true'
        env:
          PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          DAY: ${{ steps.crawl.outputs.date }}
        run: uv run python -m summaries record --date "$DAY" --path api --reason "${PROVIDER:-anthropic}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### arXiv daily: ${{ steps.crawl.outputs.date }}"
            echo "- new papers published: ${{ steps.ingest.outputs.added || 0 }} (day total ${{ steps.ingest.outputs.papers || 'unchanged' }})"
            echo "- summary mode: ${{ steps.mode.outputs.mode || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"
