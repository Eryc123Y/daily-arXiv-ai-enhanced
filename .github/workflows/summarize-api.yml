# API fallback for one day: the local Claude Code task dispatches this when
# plan usage reaches its gate, so the rest of the day is summarised through
# SUMMARY_PROVIDER (anthropic, openai or gemini) and its key secret.

name: summarize-api

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to finish (YYYY-MM-DD, UTC)"
        required: true

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LANGUAGE: ${{ vars.LANGUAGE || 'English' }}
      DATA_FETCH_ARGS: "--depth=1 --filter=blob:none"
      # Data commits are made as these (repository variables); unset, as the github-actions bot.
      COMMIT_NAME: ${{ vars.COMMIT_NAME }}
      COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
      DAY: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check input
        run: |
          if ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD, got '$DAY'"
            exit 1
          fi

      - name: Summarise the remaining papers
        env:
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          SUMMARY_REASONING_EFFORT: ${{ vars.SUMMARY_REASONING_EFFORT }}
          SUMMARY_RESPONSE_FORMAT: ${{ vars.SUMMARY_RESPONSE_FORMAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m summaries api --date "$DAY"

      - name: Log the path
        if: always()
        env:
          PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          STATUS: ${{ job.status }}
        run: uv run python -m summaries record --date "$DAY" --path api-fallback --reason "${PROVIDER:-anthropic} $STATUS"
