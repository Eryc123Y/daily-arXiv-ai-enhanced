# API fallback for one day: the local Claude Code task dispatches this when
# Eric's plan usage reaches its gate, so the rest of the day is summarised
# with Claude Haiku 5.5 using the ANTHROPIC_API_KEY repository secret.

name: summarize-api

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to finish (YYYY-MM-DD, UTC)"
        required: true

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LANGUAGE: ${{ vars.LANGUAGE || 'English' }}
      DATA_FETCH_ARGS: "--depth=1 --filter=blob:none"
      DAY: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check input
        run: |
          if ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD, got '$DAY'"
            exit 1
          fi
          if [ -z "${{ secrets.ANTHROPIC_API_KEY != '' && 'set' || '' }}" ]; then
            echo "::error::The ANTHROPIC_API_KEY secret is not set."
            exit 1
          fi

      - name: Summarise the remaining papers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m summaries api --date "$DAY"

      - name: Log the path
        if: always()
        run: uv run python -m summaries record --date "$DAY" --path api-fallback --reason "${{ job.status }}"
