# Community signals beside each day's papers: Hugging Face Daily Papers
# upvotes as data/<date>_hf.json on the `data` branch. No key, no model.
# Upvotes keep growing for a few days, so the last week's lists are reread
# every four hours; a run that changes nothing commits nothing.

name: community-signals

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_FETCH_ARGS: "--depth=1 --filter=blob:none"
      COMMIT_NAME: ${{ vars.COMMIT_NAME }}
      COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Hugging Face upvotes
        run: uv run python -m summaries hf-signals --days 7
