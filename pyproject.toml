[project]
name = "daily-arxiv"
version = "0.1.0"
description = "Daily crawl arXiv papers and use LLMs to summarize them"
authors = [
    {name = "Wei Deng", email = "dw-dengwei@outlook.com"},
    {name = "Jian Guan", email = "jianguanthu@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "openai>=1.66.3",
    "requests>=2.32.3",
    "scrapy>=2.12.0",
]
license = "LicenseRef-Modified-Apache-2.0"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["daily_arxiv", "."]

[tool.pyright]
include = ["summaries", "daily_arxiv", "scripts"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
extraPaths = ["daily_arxiv", "."]
strict = [
    "summaries/shapes.py",
    "summaries/prompting.py",
    "summaries/mode.py",
    "summaries/github.py",
    "summaries/abstracts.py",
    "summaries/abstract_retry.py",
]

[tool.ruff]
target-version = "py312"
include = ["summaries/**/*.py", "daily_arxiv/**/*.py", "scripts/**/*.py", "tests/**/*.py", "conftest.py"]
